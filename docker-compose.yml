# ImmoPilot AI — base de développement (utilisée par scripts/dev-db.sh quand Docker est disponible).
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "54320:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - immopilot-db:/var/lib/postgresql/data

volumes:
  immopilot-db:
