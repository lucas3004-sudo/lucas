[project]
name = "agency-os"
version = "0.1.0"
description = "AI Agency OS - multi-agent content agency (non-explicit content only)"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "python-multipart>=0.0.9"]

[project.optional-dependencies]
api = ["anthropic>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
agency = "agency.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agency*"]

[tool.setuptools.package-data]
agency = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
