# TEMPORAIRE — identifie le répartiteur Supabase (Supavisor) du projet de préproduction.
# Aucune donnée secrète : tentative volontaire avec un faux mot de passe.
#   bon hôte      → « password authentication failed »
#   mauvais hôte  → « Tenant or user not found »
# Ce fichier est supprimé dès le résultat obtenu.
name: Diagnostic répartiteur Supabase (temporaire)

on:
  push:
    paths: [".github/workflows/diag-pooler.yml"]

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Tester les deux hôtes possibles (région eu-west-3)
        run: |
          for h in aws-0-eu-west-3.pooler.supabase.com aws-1-eu-west-3.pooler.supabase.com; do
            echo "== $h"
            PGPASSWORD=faux-mot-de-passe-volontaire PGCONNECT_TIMEOUT=10 \
              psql "host=$h port=6543 user=postgres.kverrkvuhzuuoudvnndw dbname=postgres sslmode=require" \
              -c 'select 1' 2>&1 | head -3 || true
          done
