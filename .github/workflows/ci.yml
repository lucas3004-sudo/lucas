name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      PGPASSWORD: postgres
      NEXT_TELEMETRY_DISABLED: "1"
      TEST_DATABASE_URL_OWNER: postgres://app_owner:ci_owner@localhost:5432/immopilot_test
      TEST_DATABASE_URL: postgres://app_user:ci_user@localhost:5432/immopilot_test
      # Application (build et tests de bout en bout) — valeurs propres à la CI, sans valeur secrète réelle.
      DATABASE_URL: postgres://app_user:ci_user@localhost:5432/immopilot_test
      DATABASE_URL_AUTH: postgres://app_auth:ci_auth@localhost:5432/immopilot_test
      BETTER_AUTH_SECRET: ci-only-secret-for-ephemeral-test-database-0000
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Types
        run: pnpm typecheck
      - name: Tests unitaires
        run: pnpm test
      - name: Préparer la base de test
        run: |
          sudo apt-get install -y -q postgresql-client >/dev/null
          psql -h localhost -U postgres -d postgres -q \
            -v owner_pw=ci_owner -v user_pw=ci_user -v auth_pw=ci_auth -v ingest_pw=ci_ingest \
            -v dbname=immopilot_test -f scripts/db-bootstrap.sql
      - name: Tests d'intégration (isolation entre agences)
        run: pnpm test:integration
      - name: Build
        run: pnpm build
      - name: Navigateur pour les tests de bout en bout
        run: pnpm --filter @immopilot/web exec playwright install --with-deps chromium
      - name: Tests de bout en bout
        working-directory: apps/web
        # Une seule IP crée une douzaine de comptes en quelques secondes : seuils relevés pour les tests.
        env:
          AUTH_RATE_LIMIT_SIGNUP: "50"
          AUTH_RATE_LIMIT_SIGNIN: "100"
        run: pnpm exec playwright test --trace off
